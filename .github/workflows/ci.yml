name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
